<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>evalskills</title>
<link rel="preload" href="/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="col">
  <header class="head">
    <span class="logo">evalskills</span>
    <h1>Evaluate agent skills</h1>
    <p class="lede">Results from NVIDIA SkillEvaluator, pinned to the commit tested</p>

    <button id="add-btn" class="primary big" aria-expanded="false" aria-controls="add"><span aria-hidden="true">+</span> Add a skill</button>

    <form id="add" class="add" hidden>
      <label for="url" class="sr">Public GitHub repository URL</label>
      <div class="bar">
        <input id="url" name="url" type="text" required autocomplete="off" spellcheck="false" placeholder="github.com/owner/repo">
        <button id="lookup" type="submit" class="secondary">Find skills</button>
      </div>
      <p class="err" id="add-err" hidden></p>
      <div id="found" hidden>
        <ul id="found-list" class="picks"></ul>
        <p class="hint" id="found-meta"></p>
        <div class="pick-cat">
          <label for="cat">Category</label>
          <select id="cat"></select>
        </div>
        <button type="button" id="submit-skills" class="primary">Evaluate</button>
      </div>
      <button type="button" id="add-cancel" class="link">Cancel</button>
    </form>
  </header>

  <section aria-label="Leaderboard">
    <div class="tools">
      <nav id="tabs" class="tabs" role="tablist" aria-label="Categories"></nav>
      <input id="q" type="search" placeholder="Search" aria-label="Search skills">
    </div>
    <p class="note" id="notice">Scores are structural quality from static checks. Live runs are not available yet. <a href="/docs/METHODOLOGY.md">How scores work</a></p>
    <ol id="board" class="board"></ol>
    <p id="empty" class="hint center" hidden>No skills match</p>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
