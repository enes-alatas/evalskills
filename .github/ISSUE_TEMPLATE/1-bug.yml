name: Bug
description: "Something behaves wrongly."
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happens"
      description: "What you see today, with steps to reproduce."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What should happen"
      description: "The correct behaviour."
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      description: "Mirrored as a severity:* label at triage."
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence"
      description: "Logs or screenshots. Redact credentials to at most 8 chars plus an ellipsis."
    validations:
      required: false
