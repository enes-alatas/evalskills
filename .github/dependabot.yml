# Keeps the commit-SHA pins in .github/workflows and the digest-pinned Dockerfile base images current, so upstream
# security fixes reach us as reviewed PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # The app's image. Not the trial base (deploy/gvisor/build/base): its digest moves by its own procedure, since the
  # host pins the built image (deploy/gvisor/build/README.md). Not the scanner: it takes its image as a build arg.
  - package-ecosystem: docker
    directories: ["/deploy", "/deploy/live"]
    schedule:
      interval: weekly
    # Digest and patch refreshes only: a new Python minor or major is a runtime change, taken by its own issue (#190).
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: build
