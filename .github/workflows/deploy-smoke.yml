# Builds the deploy images (app and scanner, #65) and runs them the way the README deploy steps do, then submits one public skill end to end
# (#73). Read-only token, no secrets. The scan is static Tier 1: no skill code runs and no model is called.
name: deploy-smoke

on:
  pull_request:
    paths: ["deploy/**", "pipeline/**", "web/**", "catalog/**", "scripts/deploy-smoke.sh", ".github/workflows/deploy-smoke.yml"]
  push:
    branches: [main]
    paths: ["deploy/**", "pipeline/**", "web/**", "catalog/**", "scripts/deploy-smoke.sh", ".github/workflows/deploy-smoke.yml"]

permissions:
  contents: read

concurrency:
  group: deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker version (HOSTING asks for Engine 28 or later)
        run: docker version --format '{{.Server.Version}}'
      - name: build, start and check end to end
        env:
          SMOKE_DOWN: "1"
        run: scripts/deploy-smoke.sh
