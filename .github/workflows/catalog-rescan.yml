# Re-scans catalog skills, at their recorded commits, through the digest-pinned Tier 1 image (#110). On a pull request
# it scans a fixed sample of 5 skills from 5 repositories, which tests the script in minutes (#233). By hand
# (workflow_dispatch) it re-scans every catalog skill: that is the run whose output a PR commits, as for a repin. The new
# records and sanitized reports are printed into the log (scripts/rescan_unpack.py reads them back). Public
# repositories are cloned read-only; the image runs with no network. Read-only token, no secrets.
name: catalog-rescan

on:
  pull_request:
    paths: ["scripts/catalog_rescan.py", ".github/workflows/catalog-rescan.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-rescan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rescan:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/nvidia/skillevaluator-tier1@sha256:fbff256df8f760019539d442b7cb533d7ec50efab37f4482b7b670e2e4b4189a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pull the image anonymously
        run: |
          mkdir -p "$RUNNER_TEMP/anon"
          docker --config "$RUNNER_TEMP/anon" pull -q "$IMAGE"
      - name: re-scan
        run: |
          sample=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then sample=(--sample 5); fi
          python3 -I scripts/catalog_rescan.py "$IMAGE" "$RUNNER_TEMP/rescan" "${sample[@]}"
          head -c 900000 "$RUNNER_TEMP/rescan/rescan.md" >> "$GITHUB_STEP_SUMMARY"
      # The output is printed into the run's log, between markers, as a base64 tarball: the operator's egress allows
      # log downloads, not artifact storage (#110). It holds only sanitized reports and summary records.
      - name: print the output
        run: |
          echo "BEGIN catalog-rescan.tar.gz"
          tar -C "$RUNNER_TEMP/rescan" -czf - results.jsonl rescan.json rescan.md reports | base64 -w 76
          echo "END catalog-rescan.tar.gz"
