# Builds the trial base image for --env-mode gvisor off the shared host (#137) and checks it on Docker 29.6.1, the
# host's version, with both image stores. The tarball and its IDs are an artifact. The host operator downloads it,
# loads it in an announced step, and checks the ID (deploy/gvisor/build/README.md). No skill code and no model run
# here: the check builds each allowlisted shape around a synthetic skill. Run by hand, and on PRs that change it.
# Only a run started by hand on main uploads an artifact named `trial-base`. Every other run (PRs, forks, other
# branches) names it `trial-base-check-only-<run_id>` and marks it in the json. A PR can rewrite this file, so the
# host checks the run itself on GitHub before loading anything (deploy/gvisor/build/README.md).
name: trial-base

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/trial-base.yml
      - scripts/trial_base_check.py
      - deploy/gvisor/build/**
      - gateway/docker_build.py
      - gateway/docker_proxy.py

permissions:
  contents: read

concurrency:
  group: trial-base
  cancel-in-progress: false

env:
  BASE_IMAGE: evalskills/trial-base:d136a597
  DOCKER_VERSION: 29.6.1
  ARTIFACT: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && 'trial-base' || format('trial-base-check-only-{0}', github.run_id) }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the python:3.12-slim digest
        id: python
        run: |
          digest=$(docker buildx imagetools inspect python:3.12-slim --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "bad digest: $digest"; exit 1;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Pin it in the working copy if the committed Dockerfile still has the placeholder
        run: |
          f=deploy/gvisor/build/base/Dockerfile
          if grep -q '^FROM python:3.12-slim@sha256:0\{64\}$' "$f"; then
            sed -i "s|^FROM python:3.12-slim@sha256:0\{64\}$|FROM python:3.12-slim@${{ steps.python.outputs.digest }}|" "$f"
            echo "pinned=new" >> "$GITHUB_ENV"
          else
            echo "pinned=committed" >> "$GITHUB_ENV"
          fi
          grep '^FROM ' "$f"
      - name: Build
        run: docker build --pull -t "$BASE_IMAGE" deploy/gvisor/build/base
      - name: Save, with its IDs
        run: |
          mkdir out
          docker save "$BASE_IMAGE" | gzip -n > out/trial-base.tar.gz
          jq -n \
            --arg image "$BASE_IMAGE" \
            --arg from "$(grep '^FROM ' deploy/gvisor/build/base/Dockerfile | cut -d' ' -f2)" \
            --arg pinned "$pinned" \
            --arg built_id "$(docker image inspect --format '{{.Id}}' "$BASE_IMAGE")" \
            --arg tar_sha256 "$(sha256sum out/trial-base.tar.gz | cut -d' ' -f1)" \
            --arg commit "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg artifact "$ARTIFACT" \
            --argjson loadable "$([ "$ARTIFACT" = trial-base ] && echo true || echo false)" \
            --arg builder_docker "$(docker version --format '{{.Server.Version}}')" \
            '$ARGS.named' > out/trial-base.json
          cat out/trial-base.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: out/
          retention-days: 30

  check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        containerd_store: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: in
      - name: Install Docker ${{ env.DOCKER_VERSION }}, the host's version
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list
          sudo apt-get update -q
          v=$(apt-cache madison docker-ce | awk -v want="$DOCKER_VERSION" '$3 ~ "^5:" want "-" {print $3; exit}')
          test -n "$v"
          sudo apt-get install -y -q --allow-downgrades "docker-ce=$v" "docker-ce-cli=$v"
      - name: Choose the image store (containerd snapshotter ${{ matrix.containerd_store }})
        run: |
          cfg=/etc/docker/daemon.json
          [ -s "$cfg" ] || echo '{}' | sudo tee "$cfg"
          jq --argjson on "${{ matrix.containerd_store }}" '.features["containerd-snapshotter"] = $on' "$cfg" \
            | sudo tee "$cfg.new" && sudo mv "$cfg.new" "$cfg"
          sudo systemctl restart docker
          test "$(docker version --format '{{.Server.Version}}')" = "$DOCKER_VERSION"
          docker info --format 'driver={{.Driver}} status={{json .DriverStatus}}'
      - name: Load, then build every allowlisted shape through the proxy
        run: |
          docker image rm -f "$BASE_IMAGE" 2>/dev/null || true
          gunzip -c in/trial-base.tar.gz | docker load
          id=$(docker image inspect --format '{{.Id}}' "$BASE_IMAGE")
          echo "loaded_id=$id built_id=$(jq -r .built_id in/trial-base.json)"
          sudo python3 -I scripts/trial_base_check.py --base-image "$BASE_IMAGE" --base-id "$id"
