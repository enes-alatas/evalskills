[project]
name = "evalskills"
version = "0.0.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Vendored benchmark code stays byte-for-byte as upstream ships it (ADR-0006).
extend-exclude = ["cache", "sources", "reports", "data", "shared-tasks/*/files", "shared-tasks/*/upstream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
